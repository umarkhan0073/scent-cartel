<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin | The Scent Cartel</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;color:#111;background:#fff}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #e9e5dc;position:sticky;top:0;background:#fff}
nav{display:flex;gap:6px;flex-wrap:wrap}button,select,input{font:inherit;padding:7px 10px;border:1px solid #cfc9bc;background:#fff}
button{cursor:pointer;background:#111;color:#fff;border-color:#111}nav button{background:#fff;color:#111;text-transform:capitalize}nav button.on{background:#111;color:#fff}
main{padding:20px;max-width:1100px;margin:auto}.box{max-width:340px;margin:80px auto;padding:0 20px}.box input{width:100%;margin:8px 0}.err{color:#b00020}
.o{border:1px solid #e9e5dc;padding:12px;margin-bottom:12px}.o .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.mut{color:#666}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e9e5dc;padding:6px;text-align:left}td input[type=number]{width:90px}td input[type=text]{width:100%;min-width:180px}
.pill{display:inline-block;padding:1px 8px;border:1px solid #cfc9bc;font-size:12px}
</style></head><body><div id="app"></div>
<script>
(function(){"use strict";
var app=document.getElementById("app"),tab="orders";
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var money=function(n){return"PKR "+Number(n).toLocaleString("en-PK")};
function api(m,u,b){return fetch("/api/admin"+u,{method:m,credentials:"same-origin",headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.error||"Request failed");e.status=r.status;throw e}return j})})}
function login(msg){app.innerHTML='<div class="box"><h1>Admin sign in</h1><form id="lf"><input type="password" name="pw" placeholder="Password" autocomplete="current-password" aria-label="Password"><button>Sign in</button></form><p class="err">'+esc(msg||"")+'</p></div>';
document.getElementById("lf").onsubmit=function(e){e.preventDefault();api("POST","/login",{password:e.target.pw.value}).then(shell).catch(function(x){login(x.message)})}}
function shell(){app.innerHTML='<header><b>THE SCENT CARTEL · Admin</b><nav>'+["orders","messages","products","coupons"].map(function(t){return'<button data-t="'+t+'"'+(t===tab?' class="on"':"")+'>'+t+'</button>'}).join("")+'<button id="lo">Sign out</button></nav></header><main id="m">Loading…</main>';
app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tab=b.dataset.t;shell()}});
document.getElementById("lo").onclick=function(){api("POST","/logout",{}).then(function(){login()})};
var m=document.getElementById("m");
api("GET","/"+tab).then(function(d){({orders:orders,messages:messages,products:products,coupons:coupons})[tab](m,d)}).catch(function(e){if(e.status===401)login("Please sign in.");else m.innerHTML='<p class="err">'+esc(e.message)+'</p>'})}
var OS=["new","confirmed","shipped","delivered","cancelled"],PS=["pending","awaiting_payment","paid","failed","refunded"];
var sel=function(n,a,v){return'<select name="'+n+'">'+a.map(function(x){return'<option'+(x===v?" selected":"")+'>'+x+'</option>'}).join("")+'</select>'};
function orders(m,d){if(!d.length){m.innerHTML="<p>No orders yet.</p>";return}
m.innerHTML=d.map(function(o){var c=o.customer;return'<div class="o" data-id="'+esc(o.orderNo)+'"><b>'+esc(o.orderNo)+'</b> <span class="mut">'+esc(new Date(o.createdAt).toLocaleString())+'</span> · <b>'+money(o.totals.total)+'</b> · <span class="pill">'+esc(o.payment.method)+'</span><br>'+esc(c.name)+' · '+esc(c.phone)+' · '+esc(c.email)+'<br><span class="mut">'+esc(c.addr+", "+c.city+", "+c.prov+" "+c.zip)+(c.notes?" · Notes: "+esc(c.notes):"")+'</span><br>'+o.items.map(function(l){return esc(l.name)+" "+l.sz+"ml × "+l.qty}).join("; ")+'<div class="r">Order '+sel("status",OS,o.status)+' Payment '+sel("paymentStatus",PS,o.payment.status)+'<input name="paymentRef" placeholder="Payment reference" value="'+esc(o.payment.ref||"")+'"><button data-save>Save</button><span class="mut" data-msg></span></div></div>'}).join("");
m.querySelectorAll("[data-save]").forEach(function(b){b.onclick=function(){var box=b.closest(".o"),g=function(n){return box.querySelector("[name="+n+"]").value};api("PATCH","/orders/"+box.dataset.id,{status:g("status"),paymentStatus:g("paymentStatus"),paymentRef:g("paymentRef")}).then(function(){box.querySelector("[data-msg]").textContent="Saved"}).catch(function(e){box.querySelector("[data-msg]").textContent=e.message})}})}
function messages(m,d){m.innerHTML=d.length?d.map(function(x){return'<div class="o"><b>'+esc(x.subject)+'</b> <span class="mut">'+esc(new Date(x.createdAt).toLocaleString())+'</span><br>'+esc(x.name)+' · '+esc(x.email)+' '+esc(x.phone||"")+'<p style="white-space:pre-wrap">'+esc(x.message)+'</p></div>'}).join(""):"<p>No messages yet.</p>"}
function products(m,d){var max=d.reduce(function(a,p){return Math.max(a,p.id)},0);d=d.concat([{id:max+1,name:"",gender:"men",p5:"",p10:"",active:true,soldOut:false,isNew:true}]);
m.innerHTML='<p class="mut">The last row adds a new perfume.</p><table><tr><th>ID</th><th>Name</th><th>Category</th><th>5 ml</th><th>10 ml</th><th>Active</th><th>Sold out</th><th></th></tr>'+d.map(function(p){return'<tr data-id="'+p.id+'"><td>'+p.id+'</td><td><input type="text" name="name" value="'+esc(p.name)+'"></td><td>'+sel("gender",["men","women","unisex"],p.gender)+'</td><td><input type="number" name="p5" value="'+esc(p.p5)+'"></td><td><input type="number" name="p10" value="'+esc(p.p10)+'"></td><td><input type="checkbox" name="active"'+(p.active?" checked":"")+'></td><td><input type="checkbox" name="soldOut"'+(p.soldOut?" checked":"")+'></td><td><button data-save>'+(p.isNew?"Add":"Save")+'</button> <span class="mut" data-msg></span></td></tr>'}).join("")+'</table>';
m.querySelectorAll("[data-save]").forEach(function(b){b.onclick=function(){var r=b.closest("tr"),g=function(n){return r.querySelector("[name="+n+"]")};api("PUT","/products/"+r.dataset.id,{name:g("name").value,gender:g("gender").value,p5:g("p5").value,p10:g("p10").value,active:g("active").checked,soldOut:g("soldOut").checked}).then(function(){r.querySelector("[data-msg]").textContent="Saved"}).catch(function(e){r.querySelector("[data-msg]").textContent=e.message})}})}
function coupons(m,d){d=d.concat([{code:"",pct:10,active:true}]);
m.innerHTML='<table><tr><th>Code</th><th>Percent off</th><th>Active</th><th></th></tr>'+d.map(function(c){return'<tr><td><input type="text" name="code" value="'+esc(c.code)+'"'+(c.code?" readonly":' placeholder="New code"')+'></td><td><input type="number" name="pct" value="'+esc(c.pct)+'"></td><td><input type="checkbox" name="active"'+(c.active?" checked":"")+'></td><td><button data-save>Save</button> <span class="mut" data-msg></span></td></tr>'}).join("")+'</table>';
m.querySelectorAll("[data-save]").forEach(function(b){b.onclick=function(){var r=b.closest("tr"),g=function(n){return r.querySelector("[name="+n+"]")},code=g("code").value.trim().toUpperCase();if(!code)return;api("PUT","/coupons/"+encodeURIComponent(code),{pct:+g("pct").value,active:g("active").checked}).then(function(){r.querySelector("[data-msg]").textContent="Saved"}).catch(function(e){r.querySelector("[data-msg]").textContent=e.message})}})}
api("GET","/me").then(shell).catch(function(){login()});
})();
</script></body></html>
